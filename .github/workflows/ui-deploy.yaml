name: Deploy Storybook

# Storybook is a static bundle served as Worker assets at ui.source.coop.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: UI
      url: https://ui.source.coop
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Deploy Storybook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.storybook.jsonc
