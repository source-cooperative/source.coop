name: Build and ship the app to Cloudflare

# Reusable: builds with OpenNext and either deploys or uploads a preview
# version. Callers set `secrets: inherit`; the GitHub environment named by
# `environment` supplies the variables and secrets below. See
# deploy/CLOUDFLARE.md.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the vars and secrets
        type: string
        required: true
      wrangler_env:
        description: Environment in wrangler.jsonc (cf, staging, production)
        type: string
        required: true
      command:
        description: opennextjs-cloudflare subcommand (deploy or upload)
        type: string
        default: deploy
      extra_args:
        description: Extra wrangler arguments, e.g. --preview-alias pr-1
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and ship
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Next prerenders the landing page against DynamoDB during the build.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Runtime vars, also read by the build (NEXT_PUBLIC_* is inlined).
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DYNAMODB_ENDPOINT: ${{ vars.DYNAMODB_ENDPOINT }}
          NEXT_PUBLIC_S3_ENDPOINT: ${{ vars.NEXT_PUBLIC_S3_ENDPOINT }}
          NEXT_PUBLIC_ORY_SDK_URL: ${{ vars.NEXT_PUBLIC_ORY_SDK_URL }}
          NEXT_PUBLIC_ORY_UI_URL: ${{ vars.NEXT_PUBLIC_ORY_UI_URL }}
          NEXT_PUBLIC_LOCATION_WS_URL: ${{ vars.NEXT_PUBLIC_LOCATION_WS_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          ASSETS_BUCKET: ${{ vars.ASSETS_BUCKET }}
          ASSETS_DOMAIN: ${{ vars.ASSETS_DOMAIN }}
          ORY_OAUTH2_CLIENT_ID: ${{ vars.ORY_OAUTH2_CLIENT_ID }}
          API_AUDIENCE: ${{ vars.API_AUDIENCE }}
          CF_ANALYTICS_ACCOUNT_ID: ${{ vars.CF_ANALYTICS_ACCOUNT_ID }}
          CF_ANALYTICS_DATASET: ${{ vars.CF_ANALYTICS_DATASET }}
        run: |
          npx opennextjs-cloudflare build
          args=()
          for k in STAGE AWS_REGION DYNAMODB_ENDPOINT NEXT_PUBLIC_S3_ENDPOINT \
            NEXT_PUBLIC_ORY_SDK_URL NEXT_PUBLIC_ORY_UI_URL NEXT_PUBLIC_LOCATION_WS_URL \
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION ASSETS_BUCKET ASSETS_DOMAIN \
            ORY_OAUTH2_CLIENT_ID API_AUDIENCE CF_ANALYTICS_ACCOUNT_ID CF_ANALYTICS_DATASET; do
            [ -n "${!k}" ] && args+=(--var "$k:${!k}")
          done
          # shellcheck disable=SC2086
          npx opennextjs-cloudflare ${{ inputs.command }} --env ${{ inputs.wrangler_env }} "${args[@]}" ${{ inputs.extra_args }}
