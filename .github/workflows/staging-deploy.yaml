name: Deploy to Staging

# Only CDK. The Vercel staging deploy comes from the Git integration: the
# project's `staging` custom environment tracks `main`, so a push here
# deploys to staging.source.coop on its own. That only works while `main` is
# not the project's Production Branch -- a production branch always wins over
# custom-environment branch tracking.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-cdk:
    runs-on: ubuntu-latest
    environment: Staging-Infra
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: CDK Deploy
        run: npx cdk deploy --all --require-approval never
        env:
          STAGE: dev

