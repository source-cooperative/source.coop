name: Deploy to Cloudflare (manual)

# Ships the selected ref to cf.source.coop (or another environment) on demand.
on:
  workflow_dispatch:
    inputs:
      wrangler_env:
        description: wrangler.jsonc environment
        type: choice
        options: [cf, staging, production]
        default: cf

concurrency:
  group: cloudflare-${{ inputs.wrangler_env }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/cloudflare-app.yaml
    with:
      environment: ${{ inputs.wrangler_env == 'cf' && 'CF' || inputs.wrangler_env == 'staging' && 'Staging' || 'Production' }}
      wrangler_env: ${{ inputs.wrangler_env }}
    secrets: inherit
