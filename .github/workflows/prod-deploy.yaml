name: Deploy to Prod

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-cdk:
    runs-on: ubuntu-latest
    environment: Production-Infra
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: CDK Deploy
        run: npx cdk deploy --all --require-approval never
        env:
          STAGE: prod

  # Production deploys from here, after CDK, because Workers Builds can't
  # trigger on a release or wait for CDK. Runtime vars live on the Worker
  # (keep_vars); only the build-time NEXT_PUBLIC_* values are needed here.
  deploy-cloudflare:
    needs: deploy-cdk
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://source.coop
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Next prerenders the landing page against DynamoDB during the build.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STAGE: prod
          NEXT_PUBLIC_S3_ENDPOINT: ${{ vars.NEXT_PUBLIC_S3_ENDPOINT }}
          NEXT_PUBLIC_ORY_SDK_URL: ${{ vars.NEXT_PUBLIC_ORY_SDK_URL }}
          NEXT_PUBLIC_ORY_UI_URL: ${{ vars.NEXT_PUBLIC_ORY_UI_URL }}
          NEXT_PUBLIC_LOCATION_WS_URL: ${{ vars.NEXT_PUBLIC_LOCATION_WS_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          ASSETS_BUCKET: ${{ vars.ASSETS_BUCKET }}
          ASSETS_DOMAIN: ${{ vars.ASSETS_DOMAIN }}
        run: npx opennextjs-cloudflare build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --env production
