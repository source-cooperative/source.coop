name: Cloudflare PR preview

# Uploads the PR as a preview version of the cf Worker, without promoting it,
# and comments its URL. Same-repo branches only: fork PRs get no secrets.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cloudflare-app.yaml
    with:
      environment: CF
      wrangler_env: cf
      command: upload
      extra_args: --preview-alias pr-${{ github.event.pull_request.number }}
    secrets: inherit

  storybook:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: UI
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions upload -c wrangler.storybook.jsonc --preview-alias pr-${{ github.event.pull_request.number }}

  comment:
    needs: [app, storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URLs
        env:
          GH_TOKEN: ${{ github.token }}
          SUB: ${{ vars.WORKERS_SUBDOMAIN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Preview: https://pr-$PR-source-coop-cf.$SUB.workers.dev
          Storybook: https://pr-$PR-source-coop-ui.$SUB.workers.dev"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
